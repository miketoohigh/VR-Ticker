<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VR Odds Ticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #03060d; overflow: hidden; color: #e8efff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .tag { position: fixed; left: 14px; top: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #7f93ba; pointer-events: none; }
  .tag b { color: #ff7a8a; font-weight: 600; }
  .tag b.live { color: #38e58f; }
  .tag b.warn { color: #ffc247; }
  .status { margin: -4px 0 12px; font-size: 12px; line-height: 1.45; color: #9fb0d4; }
  #msg { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #ff9aa6; padding: 0 24px; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px;
    border-radius: 16px; background: rgba(10,16,30,.84); border: 1px solid rgba(120,150,210,.25); backdrop-filter: blur(8px); }
  button { font: inherit; font-size: 14px; color: #e8efff; background: #17233f; border: 1px solid #2b3f68;
    border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #2a5bd7; border-color: #4b7cf0; }
  #panel { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); width: min(94vw, 400px); max-height: 68vh;
    overflow-y: auto; padding: 14px 16px 10px; border-radius: 16px; background: rgba(10,16,30,.94);
    border: 1px solid rgba(120,150,210,.25); backdrop-filter: blur(10px); font-size: 13px; }
  #panel[hidden] { display: none; }
  .sec { margin: 0 0 12px; }
  .lab { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #7f93ba; margin: 0 0 6px; }
  .grp { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { padding: 8px 12px; font-size: 13px; border-radius: 9px; background: #121d36; }
  .opt.on { background: #2a5bd7; border-color: #4b7cf0; color: #fff; }
  .opt.act { background: transparent; border-style: dashed; color: #a9b9db; }
  .stepline { display: grid; grid-template-columns: 74px 1fr 66px; gap: 8px; align-items: center; margin: 4px 0; color: #a9b9db; }
  .stepline output { text-align: right; color: #e8efff; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #4b7cf0; }
  .tog { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: #a9b9db; }
  .note { margin: 12px 0 2px; color: #7f93ba; font-size: 12px; line-height: 1.5; }
  #hint { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
    background: rgba(10,16,30,.78); color: #b9c7e6; font-size: 13px; pointer-events: none; transition: opacity .8s; text-align: center; max-width: 92vw; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="tag">Odds ticker &middot; <b id="srcTag">connecting&hellip;</b></div>
<div id="msg"></div>
<div id="hint">Drag to look around &middot; scroll to zoom &middot; Settings for leagues, scores/odds and layout</div>
<div id="panel" hidden></div>
<div id="bar">
  <button id="btnVR" disabled>Checking VR&hellip;</button>
  <button id="btnAR" disabled hidden>Passthrough</button>
  <button id="btnPause">Pause</button>
  <button id="btnGear">Settings</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
if (!window.THREE) { $('msg').textContent = 'Could not load Three.js from the CDN. Check your connection and reload.'; return; }
var MU = THREE.MathUtils;

/* ======================================================================
   SETTINGS (all of these are editable from the Settings panel and are
   remembered between visits where the browser allows it)
   ====================================================================== */
var CFG = {
  radius: 4,          // metres from the viewer to the ticker surface
  cardPx: [512, 320], // card canvas size
  logos: true,        // team logos on the cards (from github.com/klunn91/team-logos)
  logoBase: '',       // optional: your own copy of that repo's folders, e.g. './team-logos/'
  source: 'live',     // 'live' = ESPN scores + Polymarket prices | 'sim' = simulator
  proxy: '',          // optional CORS proxy for the live feeds (see createLiveFeed)
  content: 'both',    // 'both' | 'scores' | 'odds'
  fmt: 'us',          // odds format: 'us' | 'dec' | 'pct'
  tilt: 25,           // 0 = ribbon above the horizon, 90 = arch straight over your head
  size: 1,            // card size multiplier
  arc: 180,           // visible arc in degrees
  speed: 4,           // degrees per second
  reverse: false,     // scroll direction
  brightness: 1,
  opacity: 1,
  env: true,          // floor grid + stars in VR (never shown in passthrough)
  leagues: {},        // league -> false when hidden
  rows: { live: true, lines: true, moves: true },
  eye: 1.6            // desktop eye height, metres
};
var BASE = { cardW: 20, pitch: 21, rowH: 12.5, gap: 1 };      // degrees at size 1
var NCARDS = 16;                                               // card meshes per row
var FLASH_MS = 6000, SCORE_MS = 4500;
var PRESETS = [0, 25, 55, 90];
var LEAGUE_ORDER = ['NFL', 'NBA', 'NHL', 'NCAAF', 'EPL'];
var uiStale = false;
function geo() {
  var s = CFG.size;
  return { cardW: BASE.cardW * s, pitch: BASE.pitch * s, rowH: BASE.rowH * s, gap: BASE.gap * s, fadeEnd: CFG.arc / 2 + 8, fadeStart: CFG.arc / 2 - 12 };
}
function leagueOn(l) { return CFG.leagues[l] !== false; }
function showScores() { return CFG.content !== 'odds'; }
function showOdds() { return CFG.content !== 'scores'; }
function hasOdds(t) { return !!t.ml && t.ml.home != null && t.ml.away != null; }
function showable(t) { return leagueOn(t.league) && (showScores() || hasOdds(t)); }   // 'Odds' mode hides games that have no prices

/* ======================================================================
   SMALL HELPERS
   ====================================================================== */
var rand = function (a, b) { return a + Math.random() * (b - a); };
var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
var roundHalf = function (x) { return Math.round(x * 2) / 2; };
var logistic = function (z) { return 1 / (1 + Math.exp(-z)); };
function randn() { var u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function pickTwo(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return [a[0], a[1]]; }
function toAmerican(q) {
  q = clamp(q, 0.03, 0.97);
  var o = q >= 0.5 ? -100 * q / (1 - q) : 100 * (1 - q) / q;
  o = Math.round(o / 5) * 5;
  if (Math.abs(o) < 100) o = o < 0 ? -100 : 100;
  return o;
}
function qOf(o) { if (o == null) return null; return o < 0 ? -o / (-o + 100) : 100 / (o + 100); }       // American odds -> implied prob
function pHomeOf(ml) { var a = qOf(ml.home), b = qOf(ml.away); return (a == null || b == null) ? null : a / (a + b); }
function fmtO(n) {                                                                                      // price in the chosen format
  if (n == null) return '—';
  if (CFG.fmt === 'dec') return (n > 0 ? 1 + n / 100 : 1 + 100 / -n).toFixed(2);
  if (CFG.fmt === 'pct') return Math.round(qOf(n) * 100) + '%';
  return n > 0 ? '+' + n : '−' + Math.abs(n);
}
function fmtLine(x) { return x == null ? '—' : x === 0 ? 'PK' : (x > 0 ? '+' : '−') + Math.abs(x); }
function fmtStart(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }).replace(',', '').toUpperCase();
}

/* ======================================================================
   DATA MODEL  (what the ticker consumes - any feed just has to produce this)

   {
     id, league, state: 'pre' | 'live' | 'final',
     home: {name, abbr}, away: {name, abbr},
     clock: 'Q3 8:42' | "67'" | '',   startTime: ms epoch,
     score: {home, away} | null,
     ml:     {home, away},                       // American odds
     spread: {line, home, away},                 // line is from the HOME side, prices American
     total:  {line, over, under},
     lastScore: {side:'home'|'away', at: ms}     // optional, highlights the score briefly
     open:   {pHome, ml:{home,away}}             // optional, otherwise first-seen values are used
     simulated: true                             // optional, prints a SIMULATED DATA tag on the cards
     tag: 'ESPN · POLYMARKET ODDS'               // optional, small source label printed on the cards
   }
   Games with no prices (ml = {}) are fine: they show as scores-only cards / schedule cards.
   Unknown league names are fine: they get their own toggle in Settings.
   ====================================================================== */
var LEAGUES = {
  NFL:   { color: '#4aa3ff', total: 3600, periods: 4, tick: 8,  events: 8.7, steps: [3, 7, 7, 6, 3],       scale: 6,   totalBase: 46,  sens: 0.12,  clock: 'Q' },
  NBA:   { color: '#ff8a4c', total: 2880, periods: 4, tick: 7,  events: 104, steps: [2, 2, 2, 3, 1, 3],    scale: 6,   totalBase: 226, sens: 0.075, clock: 'Q' },
  NHL:   { color: '#6fe0ff', total: 3600, periods: 3, tick: 8,  events: 6,   steps: [1],                   scale: 0.6, totalBase: 6,   sens: 0.55,  clock: 'P' },
  NCAAF: { color: '#ffc247', total: 3600, periods: 4, tick: 8,  events: 9,   steps: [7, 7, 3, 6, 7],       scale: 9,   totalBase: 55,  sens: 0.09,  clock: 'Q' },
  EPL:   { color: '#b88bff', total: 5400, periods: 2, tick: 12, events: 2.7, steps: [1],                   scale: 0.6, totalBase: 2.7, sens: 0.9,   clock: 'min' }
};
function T(abbr, name) { return { abbr: abbr, name: name }; }
var TEAMS = {
  NFL: [T('KC','Chiefs'),T('BUF','Bills'),T('PHI','Eagles'),T('DET','Lions'),T('BAL','Ravens'),T('SF','49ers'),T('DAL','Cowboys'),T('GB','Packers'),T('MIN','Vikings'),T('HOU','Texans'),T('LAC','Chargers'),T('SEA','Seahawks')],
  NBA: [T('BOS','Celtics'),T('OKC','Thunder'),T('DEN','Nuggets'),T('NYK','Knicks'),T('LAL','Lakers'),T('MIL','Bucks'),T('PHX','Suns'),T('GSW','Warriors'),T('MIA','Heat'),T('CLE','Cavaliers'),T('MIN','Wolves'),T('DAL','Mavericks')],
  NHL: [T('EDM','Oilers'),T('FLA','Panthers'),T('COL','Avalanche'),T('NYR','Rangers'),T('VGK','Golden Knights'),T('TOR','Maple Leafs'),T('DAL','Stars'),T('CAR','Hurricanes'),T('BOS','Bruins'),T('WPG','Jets')],
  NCAAF: [T('UGA','Georgia'),T('OSU','Ohio State'),T('TEX','Texas'),T('ORE','Oregon'),T('ALA','Alabama'),T('MICH','Michigan'),T('ND','Notre Dame'),T('PSU','Penn State'),T('CLEM','Clemson'),T('LSU','LSU')],
  EPL: [T('ARS','Arsenal'),T('MCI','Man City'),T('LIV','Liverpool'),T('CHE','Chelsea'),T('TOT','Spurs'),T('NEW','Newcastle'),T('AVL','Aston Villa'),T('BHA','Brighton'),T('MUN','Man United'),T('WHU','West Ham')]
};

/* ======================================================================
   FEED 1: SIMULATOR (default).  Random-walk odds so the ticker looks alive.
   ====================================================================== */
function clockText(L, elapsed) {
  if (elapsed >= L.total) return 'FINAL';
  if (L.clock === 'min') return Math.min(90, Math.floor(elapsed / 60) + 1) + "'";
  var plen = L.total / L.periods;
  var p = Math.min(L.periods, Math.floor(elapsed / plen) + 1);
  var left = Math.max(0, plen - (elapsed - (p - 1) * plen));
  var ss = Math.floor(left % 60);
  return L.clock + p + ' ' + Math.floor(left / 60) + ':' + (ss < 10 ? '0' : '') + ss;
}

function SimGame(league, live, id, fresh) {
  var L = LEAGUES[league];
  this.L = L; this.league = league; this.id = id; this.live = live;
  var two = pickTwo(TEAMS[league]);
  this.away = two[0]; this.home = two[1];
  this.m0 = clamp(randn() * L.scale * 0.75 + 0.1 * L.scale, -1.6 * L.scale, 1.6 * L.scale);   // home edge in points/goals
  this.m = live ? this.m0 : this.m0 + randn() * L.scale * 0.18;            // pre-game lines have already drifted a bit
  this.total0 = roundHalf(L.totalBase * rand(0.93, 1.07));
  this.tAdj = 0; this.sj = 0; this.tj = 0;
  this.elapsed = 0; this.hs = 0; this.as = 0; this.noise = 0; this.finalTicks = 0; this.lastScore = null;
  this.startTime = Math.round((Date.now() + rand(0.5, 10) * 3600e3) / 300e3) * 300e3;
  this.openP = logistic(this.m0 / L.scale * 0.9);
  this.openML = { home: toAmerican(this.openP * 1.045), away: toAmerican((1 - this.openP) * 1.045) };
  if (live) {
    var target = fresh ? rand(0, 0.03) * L.total : rand(0.05, 0.85) * L.total;
    while (this.elapsed < target) this.step(L.tick * 1.5);
    this.lastScore = null;
  }
}
SimGame.prototype.step = function (dt) {
  var L = this.L;
  if (this.live) {
    this.elapsed = Math.min(L.total, this.elapsed + dt);
    if (this.elapsed < L.total && Math.random() < (L.events / L.total) * dt) {
      var homeShare = clamp(0.5 + this.m0 / (2 * L.totalBase), 0.35, 0.65);
      var side = Math.random() < homeShare ? 'home' : 'away';
      var pts = pick(L.steps);
      if (side === 'home') this.hs += pts; else this.as += pts;
      this.lastScore = { side: side, at: Date.now() };
    }
    this.noise = clamp(this.noise * 0.93 + randn() * 0.03, -0.45, 0.45);
  } else {
    if (Math.random() < 0.22) this.m = clamp(this.m + randn() * L.scale * 0.04, this.m0 - L.scale * 0.6, this.m0 + L.scale * 0.6);
    if (Math.random() < 0.05) this.tAdj += pick([-0.5, 0.5]);
  }
  if (Math.random() < 0.12) this.sj = clamp(this.sj + pick([-1, 1]), -2, 2);
  if (Math.random() < 0.12) this.tj = clamp(this.tj + pick([-1, 1]), -2, 2);
};
SimGame.prototype.isFinal = function () { return this.live && this.elapsed >= this.L.total; };
SimGame.prototype.snapshot = function () {
  var L = this.L, rem = this.live ? 1 - this.elapsed / L.total : 1, lead = this.hs - this.as;
  var z = (this.m / L.scale * 0.9) * rem + lead * L.sens / (0.2 + rem) + (this.live ? this.noise : 0);
  var p = logistic(z);
  if (this.live && rem <= 0.002) p = lead > 0 ? 0.97 : lead < 0 ? 0.03 : 0.5;
  var pts = this.hs + this.as;
  return {
    id: this.id, league: this.league, simulated: true,
    state: !this.live ? 'pre' : (rem <= 0.002 ? 'final' : 'live'),
    home: this.home, away: this.away,
    clock: this.live ? clockText(L, this.elapsed) : '',
    startTime: this.startTime,
    score: this.live ? { home: this.hs, away: this.as } : null,
    lastScore: this.lastScore,
    ml: { home: toAmerican(p * 1.045), away: toAmerican((1 - p) * 1.045) },
    spread: { line: -roundHalf(lead + this.m * rem) || 0, home: -110 + 5 * this.sj, away: -110 - 5 * this.sj },
    total: { line: roundHalf(pts + (this.total0 + this.tAdj) * rem), over: -110 + 5 * this.tj, under: -110 - 5 * this.tj },
    open: { pHome: this.openP, ml: this.openML }
  };
};

function createSimFeed() {
  var seq = 0, games = [];
  var plan = [['NFL',1],['NFL',1],['NBA',1],['NBA',1],['NBA',1],['NHL',1],['NHL',1],['NCAAF',1],['EPL',1],
              ['NFL',0],['NFL',0],['NBA',0],['NBA',0],['NHL',0],['NCAAF',0],['NCAAF',0],['EPL',0],['EPL',0],['NHL',0]];
  plan.forEach(function (p) { games.push(new SimGame(p[0], !!p[1], ++seq, false)); });
  function snap() { return games.map(function (g) { return g.snapshot(); }); }
  var timer = null;
  return {
    isSimulated: true,
    start: function (emit) {
      emit(snap());
      timer = setInterval(function () {
        games.forEach(function (g, i) {
          g.step(g.L.tick * 1.5);
          if (g.isFinal() && ++g.finalTicks > 4) games[i] = new SimGame(g.league, true, ++seq, true);
        });
        emit(snap());
      }, 1500);
    },
    stop: function () { clearInterval(timer); timer = null; }
  };
}

/* ======================================================================
   FEED 2: The Odds API (https://the-odds-api.com)  -  UNTESTED EXAMPLE
   Needs an API key and a page that is allowed to call the API (a page hosted
   on your own domain, not the sandboxed preview). Register it with:
     OddsTicker.useFeed(OddsTicker.createOddsApiFeed({ apiKey: 'YOUR_KEY' }))
   ====================================================================== */
function createOddsApiFeed(opts) {
  var sports = opts.sports || { americanfootball_nfl: 'NFL', americanfootball_ncaaf: 'NCAAF', basketball_nba: 'NBA', icehockey_nhl: 'NHL', soccer_epl: 'EPL' };
  var every = opts.pollMs || 60000;
  function team(n) { return { name: n, abbr: n.replace(/[^A-Za-z ]/g, '').split(' ').pop().slice(0, 3).toUpperCase() }; }
  function find(book, key) { for (var i = 0; i < book.markets.length; i++) if (book.markets[i].key === key) return book.markets[i]; return null; }
  function out(m, name) { if (!m) return null; for (var i = 0; i < m.outcomes.length; i++) if (m.outcomes[i].name === name) return m.outcomes[i]; return null; }
  async function poll(emit) {
    var all = [];
    for (var key in sports) {
      try {
        var res = await fetch('https://api.the-odds-api.com/v4/sports/' + key + '/odds/?regions=' + (opts.regions || 'us') +
          '&markets=h2h,spreads,totals&oddsFormat=american&apiKey=' + encodeURIComponent(opts.apiKey));
        if (!res.ok) continue;
        (await res.json()).forEach(function (g) {
          var bk = g.bookmakers && g.bookmakers[0]; if (!bk) return;
          var h2h = find(bk, 'h2h'), sp = find(bk, 'spreads'), tot = find(bk, 'totals');
          var mh = out(h2h, g.home_team), ma = out(h2h, g.away_team), sh = out(sp, g.home_team), sa = out(sp, g.away_team);
          var ov = out(tot, 'Over'), un = out(tot, 'Under');
          var started = new Date(g.commence_time).getTime() < Date.now();
          all.push({
            id: g.id, league: sports[key], state: started ? 'live' : 'pre', startTime: new Date(g.commence_time).getTime(),
            home: team(g.home_team), away: team(g.away_team), clock: '', score: null,
            ml: { home: mh && mh.price, away: ma && ma.price },
            spread: { line: sh ? sh.point : null, home: sh && sh.price, away: sa && sa.price },
            total: { line: ov ? ov.point : null, over: ov && ov.price, under: un && un.price }
          });
        });
      } catch (e) { console.warn('odds poll failed for', key, e); }
    }
    if (all.length) emit(all);
  }
  var oddsTimer = null;
  return { isSimulated: false, start: function (emit) { poll(emit); oddsTimer = setInterval(function () { poll(emit); }, every); }, stop: function () { clearInterval(oddsTimer); } };
}

/* ======================================================================
   FEED 3: LIVE  =  ESPN scoreboard JSON (scores, clock, state)  +  Polymarket Gamma API (prices)

   ESPN decides which games exist and what the score is. Polymarket is matched onto each game by team
   name (the order of Polymarket's outcomes is never trusted) and its probabilities are converted to
   American odds, so every odds-format setting keeps working. These are prediction-market mid prices:
   no bookmaker margin, not sportsbook lines. Both APIs are unofficial/undocumented-for-this-use and can
   change, so every step is defensive and the status line tells you what was found.

   If the browser blocks either API (CORS), route both through a tiny proxy of your own:
       https://you.github.io/ticker/?proxy=https%3A%2F%2Fyour-worker.example%2F%3Fu%3D%7Burl%7D
   ({url} is replaced by the encoded target URL; without {url} the target is appended.) Cloudflare Worker:
       export default { async fetch(req) {
         const u = new URL(req.url).searchParams.get('u') || '';
         if (!/^https:\/\/(site\.api\.espn\.com|gamma-api\.polymarket\.com)\//.test(u)) return new Response('no', { status: 403 });
         const r = await fetch(u);
         return new Response(r.body, { status: r.status, headers: { 'content-type': 'application/json', 'access-control-allow-origin': '*' } });
       } }
   ====================================================================== */
function createLiveFeed(opts) {
  opts = opts || {};
  var ESPN = 'https://site.api.espn.com/apis/site/v2/sports/', GAMMA = 'https://gamma-api.polymarket.com/';
  var LG = [
    { key: 'NFL',   espn: 'football/nfl',              pmCodes: ['nfl'], pmTags: ['nfl'] },
    { key: 'NCAAF', espn: 'football/college-football', pmCodes: ['cfb'], pmTags: ['cfb', 'college-football'], extra: '&groups=80' },
    { key: 'NBA',   espn: 'basketball/nba',            pmCodes: ['nba'], pmTags: ['nba'] },
    { key: 'NHL',   espn: 'hockey/nhl',                pmCodes: ['nhl'], pmTags: ['nhl'] },
    { key: 'EPL',   espn: 'soccer/eng.1',              pmCodes: ['epl'], pmTags: ['epl', 'premier-league'] }
  ];
  var alive = false, emit = null, timer = null, meta = null, metaAt = 0, metaP = null;

  /* ---------- network ---------- */
  function viaProxy(url) {
    var p = opts.proxy; if (!p) return url;
    if (p.indexOf('{url}') >= 0) return p.replace('{url}', encodeURIComponent(url));
    return /=$/.test(p) ? p + encodeURIComponent(url) : p + url;
  }
  async function getJSON(url) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    try {
      var r = await fetch(viaProxy(url), ctl ? { signal: ctl.signal, cache: 'no-store' } : { cache: 'no-store' });

        var minus = (function (ss) { return function () { ss.set(clamp(ss.get() - ss.inc, ss.min, ss.max)); }; })(s);

function vrDraw(Lo) {

}

}

function openPanel() {

}

/* ---------- controllers ---------- */
var ray = new THREE.Raycaster(), _m = new THREE.Matrix4();

  var c = renderer.xr.getController(i);
  var lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
  var line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: 0x7fb2ff }));
  line.visible = false; line.scale.z = 3; c.add(line); c.userData.line = line;
  c.addEventListener('connected', function (e) { c.userData.src = e.data; });

});

/* ======================================================================
   DESKTOP / PHONE CONTROLS
   ====================================================================== */
var yaw = 0, pitch = MU.degToRad(32), dragging = false, lx = 0, ly = 0;
function applyView() { camera.rotation.set(pitch, yaw, 0); }
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 95 : 70; camera.updateProjectionMatrix();
}
renderer.domElement.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; try { renderer.domElement.setPointerCapture(e.pointerId); } catch (x) {} });

renderer.domElement.addEventListener('pointercancel', function () { dragging = false; });
renderer.domElement.addEventListener('pointermove', function (e) {
  if (!dragging || renderer.xr.isPresenting) return;
  var k = 0.0045 * (camera.fov / 70);
  yaw += (e.clientX - lx) * k; pitch = clamp(pitch + (e.clientY - ly) * k, -1.2, 1.55); lx = e.clientX; ly = e.clientY; applyView();
});

  e.preventDefault(); camera.fov = clamp(camera.fov + e.deltaY * 0.03, 35, 110); camera.updateProjectionMatrix();
}, { passive: false });
window.addEventListener('resize', onResize);
window.addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); } });
$('btnPause').addEventListener('click', function () { setPaused(!paused); });
$('btnGear').addEventListener('click', function () { var p = $('panel'); p.hidden = !p.hidden; });

/* ---------- headset sessions (VR and passthrough) ---------- */
var xrFrames = 0, pad = {}, presetIdx = 1, lastSpeedToast = 0;
function recenter() {
  camera.updateMatrixWorld(); camera.getWorldPosition(_p); camera.getWorldDirection(_d);
  rig.position.copy(_p); rig.rotation.y = Math.atan2(-_d.x, -_d.z);
  toast('Recentered');
}
function pollXR(dt) {
  var hoverNow = null;
  ctrl.forEach(function (c, ci) {
    var src = c.userData.src, gp = src && src.gamepad; if (!gp) return;
    var st = pad[ci] || (pad[ci] = {});
    var edge = function (i, fn) { var now = !!(gp.buttons[i] && gp.buttons[i].pressed); if (now && !st[i]) fn(); st[i] = now; };
    var hit = panelOpen ? vrRay(c) : null, pt = null, over = null;
    if (hit && hit.uv) { pt = { x: hit.uv.x * vrW, y: (1 - hit.uv.y) * pcv.height }; over = vrPick(pt.x, pt.y); if (over && hoverNow === null) hoverNow = over.id; }
    if (c.userData.line) c.userData.line.scale.z = hit && hit.distance ? hit.distance : 3;

      if (panelOpen) { if (over) act(over.fn); }
      else { setPaused(!paused); toast(paused ? 'Paused' : 'Playing'); }
    });
    edge(5, function () { if (panelOpen) closePanel(); else openPanel(); });      // B / Y: settings panel
    edge(4, recenter);                                           // A / X: recenter the ticker around you
    if (!panelOpen) {
      edge(1, function () { presetIdx = (presetIdx + 1) % PRESETS.length; setTilt(PRESETS[presetIdx]); toast('Tilt ' + CFG.tilt + '°'); });
      var y = gp.axes[3] || 0;                                   // thumbstick up/down: speed
      if (Math.abs(y) > 0.35) {

function onXREnd() {

  rig.position.set(0, CFG.eye, 0); rig.rotation.y = 0; camera.position.set(0, CFG.eye, 0); applyView(); onResize();

}

/* ---------- main loop ---------- */

renderer.setAnimationLoop(function (now) {

}
